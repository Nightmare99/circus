services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: circus
      POSTGRES_PASSWORD: circus
      POSTGRES_DB: circus
    ports:
      - "5432:5432"
    volumes:
      - circus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://circus:circus@postgres:5432/circus
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - circus-attachments:/app/data/attachments

volumes:
  circus-postgres-data:
  circus-attachments:
