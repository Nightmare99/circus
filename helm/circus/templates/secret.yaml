{{- if not .Values.jwt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "circus.jwtSecretName" . }}
  labels:
    {{- include "circus.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "circus.jwtSecretName" .) }}
  {{- $jwtSecret := .Values.jwt.secret }}
  {{- if not $jwtSecret }}
    {{- if and $existing (hasKey $existing.data .Values.jwt.existingSecretKey) }}
      {{- $jwtSecret = index $existing.data .Values.jwt.existingSecretKey | b64dec }}
    {{- else }}
      {{- $jwtSecret = randAlphaNum 48 }}
    {{- end }}
  {{- end }}
  {{ .Values.jwt.existingSecretKey }}: {{ $jwtSecret | b64enc }}
---
{{- end }}
{{- if and (not .Values.bootstrapAdmin.existingSecret) (or .Values.bootstrapAdmin.email .Values.bootstrapAdmin.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "circus.bootstrapSecretName" . }}
  labels:
    {{- include "circus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.bootstrapAdmin.existingSecretEmailKey }}: {{ .Values.bootstrapAdmin.email | quote }}
  {{ .Values.bootstrapAdmin.existingSecretPasswordKey }}: {{ .Values.bootstrapAdmin.password | quote }}
{{- end }}
