[package]
name = "mini-circus"
# Versioned and released independently of the main circus app (see
# .github/workflows/mini-circus-release.yml and mini-circus-v* tags), so it
# doesn't inherit the workspace version.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mini-circus"
path = "src/main.rs"

[dependencies]
common.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
termimad = "0.35.1"
axum = { version = "0.8.9", features = ["ws"] }
notify = "8.2.0"
