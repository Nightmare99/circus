<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>mini-circus</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --bg: #0b0c0f;
    --surface: #131519;
    --surface-2: #1b1e24;
    --surface-3: #23272f;
    --border: #262a31;
    --border-strong: #33383f;
    --text: #e7e6e2;
    --text-dim: #9b9a95;
    --text-faint: #6b6a66;
    --accent: #f5a623;
    --accent-strong: #ffb84d;
    --status-pending: #8b90a0;
    --status-in_progress: #4c8dff;
    --status-blocked: #f0555a;
    --status-completed: #34c77b;
    --priority-low: #6b7280;
    --priority-medium: #4c8dff;
    --priority-high: #f5a623;
    --priority-urgent: #f0555a;
  }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
  }
  .logo {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--accent);
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .conn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .dot.live { background: var(--status-completed); box-shadow: 0 0 7px var(--status-completed); animation: breathe 2.4s ease-in-out infinite; }
  .dot.down { background: var(--status-blocked); }

  .boards {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
  }
  .board-tab {
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .board-tab:hover { border-color: var(--border-strong); color: var(--text); }
  .board-tab.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
  .board-tab .count { color: inherit; opacity: 0.6; margin-left: 6px; font-variant-numeric: tabular-nums; }

  main { padding: 20px; }
  .empty {
    color: var(--text-faint);
    text-align: center;
    padding: 64px 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .empty p { margin: 0 0 6px; }
  .empty code {
    font-family: var(--font-mono);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 12px;
  }

  .columns { display: flex; gap: 16px; align-items: flex-start; }
  .column {
    width: 280px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: color-mix(in srgb, var(--surface) 50%, transparent);
  }
  .column-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .column-header .count { margin-left: auto; color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .column-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 44px; }
  .column-empty { text-align: center; color: var(--text-faint); font-size: 12px; padding: 10px 0; }

  .card {
    border: 1px solid var(--border);
    border-left: 3px solid var(--card-accent, var(--border));
    border-radius: 6px;
    background: var(--surface);
    padding: 10px 10px 10px 9px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  }
  .card:hover { border-color: var(--border-strong); border-left-color: var(--card-accent, var(--border-strong)); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.28); }
  .card:active { transform: translateY(0); }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .priority-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .card-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .card-title { font-size: 13px; margin-bottom: 8px; word-break: break-word; }
  .card-bottom { display: flex; justify-content: flex-end; align-items: center; min-height: 20px; }
  .avatar {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: rgba(0,0,0,0.75);
    flex-shrink: 0;
  }

  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes flash {
    0% { box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
    100% { box-shadow: 0 0 0 0 transparent; background: var(--surface); }
  }
  .card.flash { animation: flash 1.6s ease-out; }

  /* Loading skeleton */
  .skeleton-columns { display: flex; gap: 16px; }
  .skeleton-column { width: 280px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .skeleton-bar {
    height: 12px; border-radius: 4px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; justify-content: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 20;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    width: 440px; max-width: 92vw; height: 100%;
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 22px;
    transform: translateX(16px);
    transition: transform 0.18s ease;
  }
  .overlay.open .drawer { transform: translateX(0); }
  .drawer .eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
  .drawer h2 { margin: 4px 0 16px; font-size: 17px; line-height: 1.3; }
  .drawer .field-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 16px;
    padding: 12px; background: var(--surface-2); border-radius: 8px;
  }
  .drawer .field { font-size: 12.5px; min-width: 0; }
  .drawer .field .label { color: var(--text-faint); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; margin-bottom: 3px; }
  .drawer .field .value { overflow-wrap: break-word; }
  .drawer .desc { font-size: 13.5px; color: var(--text-dim); white-space: pre-wrap; margin-bottom: 20px; }
  .drawer .close {
    float: right; cursor: pointer; color: var(--text-faint);
    font-size: 20px; line-height: 1; background: none; border: none;
    padding: 4px; margin: -4px -4px 0 0; border-radius: 6px;
  }
  .drawer .close:hover { color: var(--text); background: var(--surface-2); }
  .comments h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 12px; }
  .comment { margin-bottom: 14px; padding-left: 12px; border-left: 2px solid var(--border-strong); }
  .comment .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
  .comment .meta b { color: var(--accent); }
  .comment .body { font-size: 13px; white-space: pre-wrap; }
  .no-comments { color: var(--text-faint); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* --- Responsive --- */
  @media (max-width: 720px) {
    header { padding: 10px 14px; }
    .boards { padding: 8px 14px; }
    main { padding: 12px; }
    .columns { flex-direction: column; }
    .column { width: 100%; }
    .card { padding: 12px; }
  }
  @media (max-width: 640px) {
    .drawer { width: 100%; max-width: 100%; }
    .drawer .field-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <header>
    <span class="logo">mini-circus</span>
    <span class="conn"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting…</span></span>
  </header>
  <div id="boards" class="boards"></div>
  <main>
    <div id="content"></div>
  </main>

  <div id="overlay" class="overlay">
    <div class="drawer" id="drawer"></div>
  </div>

<script>
const STATUSES = [
  ["pending", "Pending"],
  ["in_progress", "In Progress"],
  ["blocked", "Blocked"],
  ["completed", "Completed"],
];

const state = { boards: [], currentBoardId: null, tasks: [] };
// Per-board snapshot of last-seen task states, so we can tell a genuine
// server-side change from just switching tabs and flash only the former.
const snapshots = new Map(); // boardId -> Map(taskId -> updated_at)

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function hueFor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function avatar(name) {
  if (!name) return "";
  const initials = name.split(/\s+/).slice(0, 2).map((s) => s[0]?.toUpperCase()).join("");
  const hue = hueFor(name);
  return `<span class="avatar" style="background:hsl(${hue} 70% 68%)" title="${esc(name)}">${esc(initials)}</span>`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

function renderSkeleton() {
  const col = () => `<div class="skeleton-column">${[60, 90, 75].map((w) => `<div class="skeleton-bar" style="width:${w}%"></div>`).join("")}</div>`;
  document.getElementById("content").innerHTML = `<div class="skeleton-columns">${col()}${col()}${col()}${col()}</div>`;
}

async function loadBoards() {
  state.boards = await api("/api/boards");
  if (state.currentBoardId === null && state.boards.length > 0) {
    state.currentBoardId = state.boards[0].id;
  }
  renderBoardTabs();
  if (state.currentBoardId !== null) {
    await loadTasks();
  } else {
    document.getElementById("content").innerHTML =
      '<div class="empty"><p>No boards yet.</p><p>Create one with <code>mini-circus board create &lt;name&gt;</code>.</p></div>';
  }
}

async function loadTasks() {
  if (state.currentBoardId === null) return;
  state.tasks = await api(`/api/boards/${state.currentBoardId}/tasks`);
  renderBoard();
  renderBoardTabs();
}

function renderBoardTabs() {
  const el = document.getElementById("boards");
  el.innerHTML = state.boards.map((b) => {
    const count = b.id === state.currentBoardId ? state.tasks.length : null;
    const active = b.id === state.currentBoardId ? "active" : "";
    return `<div class="board-tab ${active}" data-id="${b.id}" tabindex="0" role="button">${esc(b.name)}${count !== null ? `<span class="count">${count}</span>` : ""}</div>`;
  }).join("");
  el.querySelectorAll(".board-tab").forEach((tab) => {
    const select = () => {
      state.currentBoardId = Number(tab.dataset.id);
      renderSkeleton();
      loadTasks();
    };
    tab.addEventListener("click", select);
    tab.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } });
  });
}

function renderBoard() {
  const prev = snapshots.get(state.currentBoardId);
  const flashIds = new Set();
  if (prev) {
    for (const t of state.tasks) {
      if (!prev.has(t.id) || prev.get(t.id) !== t.updated_at) flashIds.add(t.id);
    }
  }
  snapshots.set(state.currentBoardId, new Map(state.tasks.map((t) => [t.id, t.updated_at])));

  const byStatus = Object.fromEntries(STATUSES.map(([s]) => [s, []]));
  for (const t of state.tasks) (byStatus[t.status] ??= []).push(t);

  const html = `<div class="columns">${STATUSES.map(([status, label]) => `
    <div class="column">
      <div class="column-header">
        <span class="status-dot" style="background:var(--status-${status})"></span>
        ${label}
        <span class="count">${byStatus[status].length}</span>
      </div>
      <div class="column-body">
        ${byStatus[status].length ? byStatus[status].map((t) => cardHtml(t, flashIds.has(t.id))).join("") : '<div class="column-empty">—</div>'}
      </div>
    </div>
  `).join("")}</div>`;

  document.getElementById("content").innerHTML = html;
  document.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => openTask(Number(card.dataset.id)));
  });
}

function cardHtml(t, flash) {
  return `<div class="card${flash ? " flash" : ""}" data-id="${t.id}" style="--card-accent:var(--status-${t.status})">
    <div class="card-top">
      <span class="priority-dot" style="background:var(--priority-${t.priority})" title="${t.priority} priority"></span>
      <span class="card-id">#${t.id}</span>
    </div>
    <div class="card-title">${esc(t.title)}</div>
    <div class="card-bottom">
      ${t.assignee ? avatar(t.assignee) : ""}
    </div>
  </div>`;
}

async function openTask(id) {
  const t = await api(`/api/tasks/${id}`);
  const drawer = document.getElementById("drawer");
  drawer.innerHTML = `
    <button class="close" id="drawer-close" aria-label="Close">×</button>
    <div class="eyebrow">#${t.id}</div>
    <h2>${esc(t.title)}</h2>
    <div class="field-row">
      <div class="field"><div class="label">Status</div><div class="value">${t.status}</div></div>
      <div class="field"><div class="label">Priority</div><div class="value">${t.priority}</div></div>
      <div class="field"><div class="label">Assignee</div><div class="value">${t.assignee ? esc(t.assignee) : "—"}</div></div>
    </div>
    <div class="desc">${t.description ? esc(t.description) : "No description."}</div>
    <div class="comments">
      <h3>Comments (${t.comments.length})</h3>
      ${t.comments.map((c) => `
        <div class="comment">
          <div class="meta"><b>${esc(c.author)}</b> · ${fmtTime(c.created_at)}</div>
          <div class="body">${esc(c.body)}</div>
        </div>
      `).join("") || '<div class="no-comments">No comments.</div>'}
    </div>
  `;
  document.getElementById("drawer-close").addEventListener("click", closeTask);
  document.getElementById("overlay").classList.add("open");
}

function closeTask() {
  document.getElementById("overlay").classList.remove("open");
}
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeTask();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTask();
});

// --- live updates: a WS ping means "something changed", refetch and re-render ---
let ws = null;
let reconnectTimer = null;

function setConn(status) {
  const dot = document.getElementById("conn-dot");
  const text = document.getElementById("conn-text");
  dot.className = "dot " + (status === "live" ? "live" : status === "down" ? "down" : "");
  text.textContent = status === "live" ? "live" : status === "down" ? "reconnecting…" : "connecting…";
}

function connectWs() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => setConn("live");
  ws.onmessage = () => {
    loadBoards().catch(() => {});
  };
  ws.onclose = () => {
    setConn("down");
    reconnectTimer = setTimeout(connectWs, 2000);
  };
  ws.onerror = () => ws.close();
}

// Fallback poll regardless of WS state - cheap insurance against a missed
// filesystem event on some platform/mount type.
setInterval(() => loadBoards().catch(() => {}), 8000);

renderSkeleton();
loadBoards().catch((e) => {
  document.getElementById("content").innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
});
connectWs();
</script>
</body>
</html>
